# Production docker-compose for GolfAdmin v2
# Usage:
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# Requires .env in project root (copy from .env.example).

services:
  backend:
    build: ./backend
    container_name: golf-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/golf.db}
      SECRET_KEY: ${SECRET_KEY:?missing SECRET_KEY}
      CLUB_NAME: ${CLUB_NAME:-МГГК · Крылатское}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://golf.example.com}
      PYTHONUNBUFFERED: "1"
    volumes:
      - golf_data:/data
    expose:
      - "8000"
    networks: [golf_net]

  frontend:
    build: ./frontend
    container_name: golf-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks: [golf_net]
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: golf-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks: [golf_net]

volumes:
  golf_data:

networks:
  golf_net:
    driver: bridge
