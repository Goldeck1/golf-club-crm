# GolfAdmin production reverse proxy (TLS + HSTS + CSP)
# Замените golf.example.com на свой домен и приложите сертификат Let's Encrypt.

upstream golf_api {
    server backend:8000;
    keepalive 32;
}

upstream golf_ui {
    server frontend:80;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name golf.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name golf.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ─────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Размер тела
    client_max_body_size 10m;

    # Rate limit login
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # ── API (FastAPI) ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://golf_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    location = /api/auth/login {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://golf_api/auth/login;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        access_log off;
        proxy_pass http://golf_api/health;
    }

    # ── SPA ──────────────────────────────────────────────────────────
    location / {
        proxy_pass http://golf_ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
